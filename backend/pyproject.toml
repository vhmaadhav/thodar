[project]
name = "thodar"
version = "0.1.0"
description = "Thodar backend: one follow-up thread for every mother and baby"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thodar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
